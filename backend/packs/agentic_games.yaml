    - [hotfix, Ship hotfix 2.4.1, release, repair, 2400, 5, Roll forward with the corrected shader migration.]
    - [rollback, Roll back to 2.3 for affected GPUs, crashes, reroute, 1600, 2, Serve the previous build to affected hardware.]
    - [triage_crashes, Symbolicate crash dumps, release, inspect, 200, 0, Group crash signatures by build and hardware.]
    - [scale_servers, Scale login servers, servers, boost, 1200, 1, Absorb retry storms temporarily.]
    - [goodwill, Proactive goodwill credit, refunds, reroute, 1500, 2, Offer in-game credit before refunds are requested.]
  rules:
    - {name: review_bomb, at: 11, when: ["release.intrinsic<60"], target: social, health: 45, message: 'A creator video titled "save wiper patch" trends; review score falls to Mixed.'}
    - {name: refund_wave, at: 20, when: ["reviews.health<60", "!refunds.bypass"], target: revenue, health: 48, message: Refund requests exceed the platform auto-approval threshold.}
  decoys: [A DDoS attack on login servers, A payment provider outage, An expired TLS certificate on the patch CDN]
  agents: {engineering: Engineering lead, operations: LiveOps producer, legal: Community & PR, investigator: Support analyst, finance: Finance partner, executive: Product director}
  entity: {player: Customer, platform: [PC, Console, Mobile], gpu_gen: [2018, 2019, 2020, 2021, 2022, 2023], spend: [0, 250]}
  emits: [{signal: player_churn, node: revenue, below: 60}]
  consumes: [cloud_outage]
  building_blocks: [SimPy, NetworkX, LangGraph]
  objectives: [Restore stability, Protect revenue, Rebuild community trust]

