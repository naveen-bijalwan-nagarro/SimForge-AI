- key: fraud_ring
  title: Massive Multiplayer Fraud Ring
  category: Agentic Games
  summary: Bot farms, shared and stolen accounts, coordinated item transfers, mule accounts and chargebacks. Traverse the account graph to find the ring before it launders the economy.
  unit: accounts
  impact: laundered gold (k)
  nodes:
    - [bots, Bot-farm sign-ups, security, 6, log, Auth gateway]
    - [accounts, Account takeover & sharing, investigator, 5, graph, Identity graph]
    - [transfers, Coordinated item transfers, investigator, 5, transaction, Trade ledger]
    - [mules, Mule accounts, finance, 4, graph, Account graph]
    - [marketplace, Marketplace listings, operations, 6, transaction, Marketplace]
    - [payments, Payments & chargebacks, finance, 4, transaction, Payment processor]
    - [trust, Player trust & safety, safety, 5, ticket, T&S queue]
    - [support, Player support, operations, 6, ticket, Support desk]
    - [revenue, Revenue & refunds, finance, 6, kpi, Finance dashboard]
  edges: [[bots, accounts], [accounts, transfers], [transfers, mules], [mules, payments], [transfers, marketplace], [marketplace, trust], [payments, revenue], [trust, support], [support, revenue]]
  incident: {node: accounts, cause: A credential-stuffing bot farm takes over dormant accounts and shares them across a 40-account mule network., signal: dormant accounts logging in from shared device fingerprints}
  extra_incidents:
    - {node: payments, tick: 16, severity: 0.55, cause: Stolen cards buy premium currency that is funnelled to mule accounts, signal: premium purchases from new cards spike}
  secondary: marketplace
  actions:
    - [lock_accounts, Force reset on taken-over accounts, accounts, repair, 2100, 4, Reset credentials and revoke sessions on linked accounts.]
    - [trace_graph, Traverse device/account graph, accounts, inspect, 250, 0, Expose shared devices and transfer cycles.]
    - [freeze_transfers, Freeze high-value transfers, transfers, contain, 700, 1, Stops laundering but blocks legitimate trades.]
    - [stepup_payments, Step-up verification on purchases, payments, repair, 1500, 3, Adds 3-D Secure style checks for new cards.]
    - [moderation_surge, Surge trust & safety moderators, trust, boost, 1100, 1, Temporary review capacity.]
  rules:
    - {name: laundering, at: 12, when: ["accounts.intrinsic<60", "!transfers.isolated"], target: mules, health: 38, message: Items are laundered through mule accounts and resold for real money.}
    - {name: chargeback_wave, at: 22, when: ["payments.health<60"], target: revenue, health: 50, message: Chargeback ratio breaches the processor threshold; fees increase.}
  decoys: [A marketplace price-index bug mislabels normal trades, A regional ISP outage causes mass re-logins, Seasonal event rewards inflate item volumes]
  agents: {security: Anti-bot engineer, investigator: Fraud investigator, finance: Payments risk, operations: LiveOps manager, safety: Trust & safety lead}
  entity: {account: Account, device: [DEV-01, DEV-02, DEV-03, DEV-04, DEV-05, DEV-06], item: 'seq:ITEM', gold: [50, 9000]}
  emits: [{signal: fraud_wave, node: mules, below: 55}]
  consumes: [compromised_credentials]
  building_blocks: [NetworkX, Mesa, PyOD]
  objectives: [Stop laundering, Avoid blocking honest players, Keep chargebacks under threshold]

- key: liveops_war_room
