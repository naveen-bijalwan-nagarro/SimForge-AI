    - {name: audit_fail, at: 21, when: ["data.health<55"], target: compliance, health: 45, message: CIS benchmark and PCI controls fail.}
  decoys: [A public S3 bucket used for a website, A dormant IAM user, An outdated AMI]
  agents: {security: Cloud security architect, engineering: DevOps lead, investigator: Detection engineer, legal: Compliance manager}
  entity: {finding: 'seq:FND', resource: Asset, owner: Employee, severity: [low, medium, high, critical]}
  emits: [{signal: compromised_credentials, node: secrets, below: 55}]
  building_blocks: [CloudGoat, GCPGoat, IAM policy simulators]
  objectives: [Close escalation paths, Keep CI working, Audit readiness]

