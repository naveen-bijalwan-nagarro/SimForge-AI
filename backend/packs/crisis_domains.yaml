    - [storage, S3 buckets, engineering, 4, log, Access logs]
    - [table, DynamoDB tables, engineering, 4, sensor, Table metrics]
    - [customers, Customer workflows, finance, 6, kpi, Business dashboard]
  edges: [[iam, lambda], [vpc, lambda], [gateway, lambda], [lambda, queue], [lambda, storage], [queue, table], [storage, customers], [table, customers]]
  incident: {node: iam, cause: A least-privilege refactor denies s3:PutObject to the processing Lambda role., signal: AccessDenied errors in function logs}
