# Multi-domain crisis and digital-twin worlds. Building blocks name the open-source tools a
# production integration would use; these worlds run natively with synthetic data.
# Node tuple: [id, label, role, capacity, evidence modality, source system]
# Action tuple: [id, label, target, effect, cost, duration, description]

# ---------------------------------------------------------------- Cyber & Cloud
- key: soc_attack_chain
  title: Cyber Attack / SOC Response
  category: Cyber & Cloud
  summary: Phishing → compromised host → lateral movement → cloud access → data exposure → detection → containment → recovery.
  unit: alerts
  impact: exposed records (k)
  nodes:
    - [email, Mail gateway, security, 6, email, Secure email gateway]
    - [endpoint, Compromised endpoint, security, 5, log, EDR]
    - [lateral, Internal network, security, 5, graph, NetFlow]
    - [cloud, Cloud console access, engineering, 4, log, Cloud audit trail]
    - [data, Customer data store, security, 4, log, DLP]
    - [siem, SIEM detection, investigator, 5, log, SIEM]
    - [response, Containment & recovery, operations, 4, ticket, SOAR]
    - [business, Business services, finance, 6, kpi, Service health]
    - [legal, Breach notification, legal, 4, document, Privacy office]
  edges: [[email, endpoint], [endpoint, lateral], [lateral, cloud], [cloud, data], [data, legal], [endpoint, siem], [siem, response], [data, business], [response, business]]
  incident: {node: email, cause: A credential-phishing campaign steals an engineer's SSO session through a malicious OAuth consent page., signal: users report a suspicious consent prompt}
  secondary: siem
  actions:
    - [purge_campaign, Purge campaign and revoke OAuth grants, email, repair, 2000, 3, Remove the lure and invalidate stolen consent.]
    - [investigate_mail, Investigate phishing telemetry, email, inspect, 200, 0, Find recipients and clicks.]
    - [isolate_host, Isolate compromised endpoint, endpoint, contain, 600, 1, Stop lateral movement; the user loses the laptop.]
    - [rotate_keys, Rotate cloud access keys, cloud, repair, 1500, 2, Invalidate stolen cloud sessions.]
    - [ir_surge, Engage IR retainer, response, boost, 1600, 1, More responders for six minutes.]
  rules:
    - {name: pivot, at: 11, when: ["email.intrinsic<60", "!endpoint.isolated"], target: cloud, health: 40, message: Attacker pivots to the cloud console with a stolen session token.}
    - {name: exfiltration, at: 20, when: ["cloud.health<55"], target: data, health: 35, message: Large egress from the customer data bucket to an unknown ASN.}
  decoys: [A vulnerability scanner flooding the SIEM, A misconfigured VPN causing impossible-travel alerts, An expired certificate on the mail gateway]
  agents: {security: SOC lead, engineering: Cloud engineer, investigator: Threat hunter, operations: Incident manager, finance: Business continuity, legal: Privacy counsel}
  entity: {alert: 'seq:ALR', host: Asset, user: Employee, technique: [T1566, T1078, T1021, T1530, T1041]}
  emits: [{signal: compromised_credentials, node: cloud, below: 60}, {signal: data_breach, node: data, below: 50}]
  building_blocks: [MITRE CALDERA, Atomic Red Team, Stratus Red Team, CloudGoat]
  objectives: [Contain before exfiltration, Minimise business disruption, Meet notification duties]

- key: cti_soc
  title: Agentic Cyber SOC (CTI → ATT&CK → Emulation)
  category: Cyber & Cloud
  summary: Threat report → CTI extraction → ATT&CK graph → attack simulation → alerts → SOC investigation → remediation. Detection coverage gaps are the real enemy.
  unit: techniques
  impact: undetected technique-hours
  nodes:
    - [report, Threat report intake, investigator, 5, document, CTI feed]
    - [cti, CTI extraction (STIX), investigator, 4, graph, CTI platform]
    - [attack_graph, ATT&CK technique graph, investigator, 4, graph, ATT&CK Navigator]
    - [emulation, Adversary emulation, security, 4, log, CALDERA]
    - [detections, Detection rules, engineering, 4, log, Detection-as-code]
    - [alerts, Alert pipeline, security, 5, log, SIEM]
    - [investigation, SOC investigation, security, 5, ticket, Case management]
    - [remediation, Remediation, operations, 4, ticket, Change management]
    - [posture, Security posture, executive, 6, kpi, Risk dashboard]
  edges: [[report, cti], [cti, attack_graph], [attack_graph, emulation], [emulation, alerts], [detections, alerts], [alerts, investigation], [investigation, remediation], [remediation, posture], [attack_graph, posture]]
  incident: {node: detections, cause: A stale detection pack silently disabled rules for T1098 account manipulation after a schema change., signal: emulated techniques produce no alerts}
  secondary: investigation
  actions:
    - [redeploy_rules, Fix and redeploy detection pack, detections, repair, 1900, 3, Restore coverage for manipulated accounts.]
    - [coverage_test, Run coverage test with emulation, detections, inspect, 250, 0, Map emulated techniques to alerts.]
    - [manual_hunt, Manual threat hunt, investigation, boost, 1200, 1, Analysts hunt for the uncovered technique.]
    - [auto_triage, Auto-triage low-risk alerts, alerts, reroute, 900, 2, Route noise away from analysts.]
  rules:
    - {name: blind_spot, at: 12, when: ["detections.intrinsic<60", "!investigation.boosted"], target: remediation, health: 40, message: Persistence via account manipulation goes unremediated.}
    - {name: posture_drop, at: 22, when: ["remediation.health<55"], target: posture, health: 45, message: Board risk dashboard turns red for identity threats.}
  decoys: [An overloaded CTI parser, A false-positive storm from a new EDR, A lapsed threat-intel subscription]
  agents: {investigator: CTI analyst, security: Detection engineer, engineering: SIEM engineer, operations: Remediation owner, executive: CISO}
  entity: {technique: [T1098, T1136, T1078, T1059, T1003, T1486], report: 'seq:RPT', analyst: Employee, confidence: [0.2, 0.99]}
  consumes: [data_breach]
  building_blocks: [MITRE CALDERA, CALDERA MCP plugin, STIX/TAXII, MITRE ATT&CK]
  objectives: [Detection coverage, Analyst focus, Mean time to remediate]

- key: ot_ics
  title: OT / ICS Cyberattack
  category: Cyber & Cloud
  summary: Attacker → BACnet/DNP3 → HVAC and pump control changes → physical consequence → SOC and plant-operator response.
  unit: control events
  impact: process deviation minutes
  visual: thermal
  nodes:
    - [it_network, IT/OT boundary, security, 5, graph, Firewall logs]
    - [historian, Plant historian, engineering, 4, sensor, Historian]
    - [gateway, DNP3/BACnet gateway, security, 4, log, OT IDS]
    - [plc, PLC controllers, engineering, 4, log, Engineering workstation]
    - [pumps, Pump station, engineering, 5, image, Thermal cameras]
    - [hvac, HVAC control, engineering, 4, sensor, BMS]
    - [safety_sys, Safety instrumented system, safety, 3, sensor, SIS]
    - [plant_ops, Plant operations, operations, 5, kpi, Control room]
    - [soc, OT SOC, security, 5, ticket, SOC]
  edges: [[it_network, historian], [historian, gateway], [gateway, plc], [plc, pumps], [plc, hvac], [pumps, safety_sys], [hvac, plant_ops], [safety_sys, plant_ops], [gateway, soc]]
  incident: {node: gateway, cause: Unauthenticated DNP3 write commands from a compromised historian change pump setpoints., signal: unexpected setpoint writes observed}
  secondary: plc
  actions:
    - [lock_gateway, Enforce authenticated writes on the gateway, gateway, repair, 2100, 4, Block unauthenticated function codes.]
    - [ot_forensics, Analyze OT network capture, gateway, inspect, 250, 0, Decode DNP3 function codes.]
    - [manual_mode, Switch pumps to manual control, pumps, reroute, 1400, 2, Operators control pumps locally.]
    - [isolate_historian, Isolate historian from OT, historian, contain, 700, 1, Cut the attack path; lose trending.]
    - [ops_staff, Add control-room operators, plant_ops, boost, 900, 1, Extra operator attention.]
  rules:
    - {name: overpressure, at: 11, when: ["gateway.intrinsic<60", "!pumps.bypass"], target: safety_sys, health: 38, message: Pressure approaches the SIS trip point; pumps cavitate.}
    - {name: comfort_loss, at: 21, when: ["hvac.health<55"], target: plant_ops, health: 50, message: HVAC setpoints drift; clean-room tolerance lost.}
  decoys: [A failing pressure transmitter, A scheduled PLC firmware upgrade, An operator training exercise]
  agents: {security: OT security analyst, engineering: Control engineer, safety: Process safety engineer, operations: Shift supervisor}
  entity: {tag: Sensor, device: Asset, operator: Employee, setpoint_bar: [2.0, 9.5]}
  building_blocks: [MITRE CALDERA for OT, CALDERA DNP3 plugin, CALDERA BACnet plugin]
  objectives: [Process safety, Availability, Evidence preservation]

- key: cloud_cascade
  title: Complex Cloud Failure
  category: Cyber & Cloud
  summary: Bad IaC → deployment → pod failures → autoscaling → database latency → cascading API failure → SLA violation → rollback.
  unit: requests
  impact: failed requests (k)
  nodes:
    - [iac, IaC change, engineering, 4, document, OpenTofu plan]
    - [deploy, Deployment pipeline, engineering, 4, log, Argo Workflows]
    - [pods, Pods, engineering, 6, log, Kubernetes events]
    - [autoscaler, Autoscaler, operations, 4, sensor, HPA metrics]
    - [database, Database, engineering, 4, sensor, DB metrics]
    - [cache, Cache, operations, 5, sensor, Cache metrics]
    - [api, Public API, operations, 6, log, API gateway]
    - [checkout, Checkout service, finance, 5, kpi, Business metrics]
    - [sla, Customer SLA, finance, 6, kpi, SLA reports]
  edges: [[iac, deploy], [deploy, pods], [pods, autoscaler], [autoscaler, database], [database, api], [cache, api], [api, checkout], [checkout, sla]]
  incident: {node: iac, cause: An OpenTofu change halves the DB connection pool and removes pod anti-affinity., signal: plan applied with connection-pool changes}
  secondary: database
  actions:
    - [revert_iac, Revert IaC and redeploy, iac, repair, 2000, 4, Restore the previous infrastructure definition.]
    - [diff_plan, Diff the applied plan, iac, inspect, 200, 0, Identify the risky resource changes.]
    - [rollback, Roll back application release, deploy, reroute, 1200, 2, Serve the previous version.]
    - [scale_db, Add read replicas, database, boost, 1500, 1, Temporary DB capacity.]
    - [shed_load, Rate-limit non-critical APIs, api, contain, 500, 1, Protect checkout but block partners.]
  rules:
    - {name: pool_exhaustion, at: 11, when: ["iac.intrinsic<60", "!database.boosted"], target: api, health: 40, message: Connection-pool exhaustion cascades into API timeouts.}
    - {name: sla_breach, at: 22, when: ["checkout.health<55"], target: sla, health: 45, message: Monthly SLA budget consumed; service credits due.}
  decoys: [A cloud-provider regional outage, A DDoS on the API gateway, A slow third-party payment API]
  agents: {engineering: Platform SRE, operations: Incident commander, finance: Customer success}
  entity: {service: Asset, customer: Customer, region: [us-east, eu-west, ap-south], latency_ms: [20, 2400]}
  emits: [{signal: cloud_outage, node: api, below: 55}]
  consumes: [network_outage]
  building_blocks: [kind, OpenTofu, Argo Workflows, Chaos Mesh, Prefect]
  objectives: [Restore SLOs, Safe rollback, Protect revenue]

- key: localstack_lab
  title: Local Cloud Disaster Lab
  category: Cyber & Cloud
  summary: API, Lambda, storage, IAM, queue and network failures practised locally without cloud cost.
  unit: invocations
  impact: failed invocations (k)
  nodes:
    - [iam, IAM roles, security, 4, log, CloudTrail (local)]
    - [vpc, VPC & NAT, engineering, 4, graph, Flow logs]
    - [gateway, API Gateway, operations, 5, log, API logs]
    - [lambda, Lambda functions, engineering, 5, log, Function logs]
