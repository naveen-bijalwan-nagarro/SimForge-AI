    - {name: stale_reports, at: 21, when: ["storage.health<55"], target: customers, health: 50, message: Customer reports are not generated for the day.}
  decoys: [Lambda concurrency limits, A cold-start regression, An S3 eventual-consistency issue]
  agents: {security: Cloud security engineer, engineering: Serverless engineer, operations: Cloud operations, finance: Customer impact}
  entity: {function: [ingest, transform, notify, report], request: 'seq:REQ', customer: Customer, duration_ms: [15, 9000]}
  emits: [{signal: cloud_outage, node: customers, below: 78}]
  building_blocks: [LocalStack, OpenTofu, pytest]
  objectives: [Restore processing, Least privilege, Recovery point objective]

- key: cloud_misconfig
  title: Cloud Security Misconfiguration
  category: Cyber & Cloud
  summary: IAM mistake → exposed service → privilege chain → alert → remediation. Designed for disposable sandbox accounts only.
  unit: findings
  impact: exposure-hours
  nodes:
    - [iam, IAM policy, security, 4, document, IAM analyzer]
    - [ci_role, CI/CD role, engineering, 4, log, CI logs]
